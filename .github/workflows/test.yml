name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb-ha:pg16-all
        env:
          POSTGRES_DB: sentinel
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'sentinel_ci_pass' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check src/ --ignore=E501,F401,F841

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          DATABASE_URL: postgresql+asyncpg://sentinel:${{ secrets.POSTGRES_PASSWORD || 'sentinel_ci_pass' }}@localhost:5432/sentinel

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}/src
